    function MotionFade({ children, delay = 0 }) {

    function BlurText({ text, className = "" }) {
      const [visible, setVisible] = React.useState(false);
      const ref = React.useRef(null);

      React.useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
            }
          },
          {
            threshold: 0.1
          }
        );

        if (ref.current) {
          observer.observe(ref.current);
        }

        return () => observer.disconnect();
      }, []);

      return (
        <p
          ref={ref}
          className={className}
          style={{
            display: "flex",
            flexWrap: "wrap",
            justifyContent: "center",
            rowGap: "0.1em"
          }}
        >
          {text.split(" ").map((word, i) => (
            <motion.span
              key={i}
              style={{
                display: "inline-block",
                marginRight: "0.28em"
              }}
              initial={{
                filter: "blur(10px)",
                opacity: 0,
                y: 50
              }}
              animate={
                visible
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0]
                    }
                  : {}
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: "easeOut",
                delay: (i * 100) / 1000
              }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    function FadingVideo({
      src,
      className = "",
      style = {}
    }) {

      const videoRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);

      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      const fadeTo = React.useCallback((target, duration) => {
        const video = videoRef.current;
        if (!video) return;

        cancelAnimationFrame(rafRef.current);

        const startOpacity = parseFloat(video.style.opacity || "0");
        const startTime = performance.now();

        const animate = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);

          const current =
            startOpacity + (target - startOpacity) * progress;

          video.style.opacity = current;

          if (progress < 1) {
            rafRef.current = requestAnimationFrame(animate);
          }
        };

        rafRef.current = requestAnimationFrame(animate);

      }, []);

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        video.style.opacity = 0;

        const handleLoaded = async () => {
          video.style.opacity = 0;

          try {
            await video.play();
          } catch (e) {}

          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          if (
            !fadingOutRef.current &&
            video.duration - video.currentTime <= FADE_OUT_LEAD &&
            video.duration - video.currentTime > 0
          ) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          video.style.opacity = 0;

          setTimeout(async () => {
            video.currentTime = 0;

            try {
              await video.play();
            } catch (e) {}

            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener("loadeddata", handleLoaded);
        video.addEventListener("timeupdate", handleTimeUpdate);
        video.addEventListener("ended", handleEnded);

        return () => {
          cancelAnimationFrame(rafRef.current);

          video.removeEventListener("loadeddata", handleLoaded);
          video.removeEventListener("timeupdate", handleTimeUpdate);
          video.removeEventListener("ended", handleEnded);
        };
      }, [fadeTo]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{
            opacity: 0,
            ...style
          }}
        />
      );
    }
